name: Windows checks and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile and run regressions
        run: |
          python -m py_compile monitor.pyw
          python -m unittest discover -s tests -v
          python tools/ui_selftest.py
      - name: Build executable
        run: python tools/build.py
      - name: Check packaged startup and Unicode paths
        run: python tools/check_packaged.py
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopMonitor-Windows-x64
          path: dist/DesktopMonitor-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DesktopMonitor-Windows-x64
          path: release
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/DesktopMonitor-Windows-x64.zip --title "Desktop Monitor $GITHUB_REF_NAME" --notes-file CHANGELOG.md
